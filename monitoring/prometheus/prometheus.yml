global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: motomatch-backend
    metrics_path: /metrics
    static_configs:
      # The FastAPI backend running on your host machine.
      - targets: ["host.docker.internal:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
