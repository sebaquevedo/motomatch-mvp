# Observability stack for MotoMatch.
#
# The backend runs on your host machine (python main.py on :8000).
# These two containers watch it from the outside:
#   - Prometheus scrapes http://host.docker.internal:8000/metrics
#   - Grafana reads from Prometheus and renders the pre-provisioned dashboard
#
# Run from the monitoring/ directory:  docker compose up -d
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: motomatch-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container reach the backend running on the host (needed on Linux;
      # harmless on Windows/Mac where host.docker.internal already resolves).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: motomatch-grafana
    ports:
      - "3000:3000"
    environment:
      # Local demo only — anonymous admin access so you can jump straight in.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
